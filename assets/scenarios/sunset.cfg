# Cenario de por do sol. Edite este arquivo e execute o build para copiar os assets.
# Valores RGB de 0 a 1; posicao em unidades do mundo (tabuleiro no centro).
skybox assets/skybox/1
lightPosition -40 16 90
lightColor 1.0 0.80 0.62
# Intensidade independente da distancia, como uma fonte distante representando o sol.
lightIntensity 1.76
ambientColor 0.90 0.94 1.0
ambientStrength 0.42
diffuseStrength 0.75
specularStrength 0.075
woodSpecularStrength .225
shininess 32
fogColor 0.24 0.19 0.18
fogDensity 0.00008
# Projecao da luz: deve abranger mesa, pecas e objetos adicionais.
# Ajuste automatico evita cortes ao mover a luz. Raio ao redor do tabuleiro.
shadowAutoFit 1
shadowRadius 20
# Usados apenas quando shadowAutoFit for 0.
shadowFov 50
shadowNear 35
shadowFar 110
shadowBias 0.0005
shadowMinBias 0.0001
# Pequeno deslocamento da consulta, em unidades do mundo, evita marcas nas curvas.
shadowNormalOffset 0.02
